<!doctype html>
<html lang="ja">

<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>USDJPY MT5 Chart</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
</head>

<body>

<header>
    <div class="brand">
        <b>USDJPY Analysis</b>
        <span id="status">loading...</span>
    </div>

    <div class="controls">

        <label>
            時間足

            <select id="tf">
                <option>M1</option>
                <option>M5</option>
                <option>M15</option>
                <option>H1</option>
                <option>H4</option>
                <option>D1</option>
            </select>
        </label>

        <div class="range-group">
            <span>表示期間</span>

            <button
                data-range="day"
                class="active"
            >
                日
            </button>

            <button data-range="month">
                月
            </button>

            <button data-range="year">
                年
            </button>

            <button data-range="all">
                全期間
            </button>
        </div>

        <label id="dateLabel">
            基準日

            <input
                id="datePick"
                type="date"
            >
        </label>

        <button id="fitBtn">
            全体を表示
        </button>

        <label>
            <input
                type="checkbox"
                data-ind="bb2"
                checked
            >
            BB ±2σ
        </label>

        <label>
            <input
                type="checkbox"
                data-ind="bb3"
                checked
            >
            BB ±3σ
        </label>

        <label>
            <input
                type="checkbox"
                data-ind="sma20"
                checked
            >
            SMA20
        </label>

        <label>
            <input
                type="checkbox"
                data-ind="sma75"
            >
            SMA75
        </label>

        <label>
            <input
                type="checkbox"
                data-ind="ema20"
            >
            EMA20
        </label>

        <label>
            <input
                type="checkbox"
                data-ind="rsi"
                checked
            >
            RSI14
        </label>

    </div>
</header>


<main>

    <div class="summary">

        <div id="periodInfo">
            期間を読み込み中...
        </div>

        <div
            id="ohlc"
            class="info"
        >
            カーソルをローソク足に合わせてください
        </div>

    </div>


    <div id="chart"></div>


    <div id="rsiWrap">

        <div class="panel-title">
            RSI 14
        </div>

        <div id="rsi"></div>

    </div>

</main>


<script src="app.js"></script>

</body>
</html>
